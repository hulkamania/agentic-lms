services:
  mariadb:
    image: docker.io/bitnami/mariadb:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MOODLE_DB_NAME}
      - MARIADB_USER=${MOODLE_DB_USER}
      - MARIADB_PASSWORD=${MOODLE_DB_PASSWORD}
    volumes:
      - 'mariadb_data:/bitnami/mariadb'
    networks:
      - moodle-network
    healthcheck:
      test: ['CMD', '/opt/bitnami/scripts/mariadb/healthcheck.sh']
      interval: 15s
      timeout: 5s
      retries: 6

  moodle:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${MOODLE_PORT}:80'
    environment:
      - MOODLE_DATABASE_TYPE=mariadb
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT=${MOODLE_DATABASE_PORT}
      - MOODLE_DB_NAME=${MOODLE_DB_NAME}
      - MOODLE_DB_USER=${MOODLE_DB_USER}
      - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_ADMIN_USER=${MOODLE_ADMIN_USER}
      - MOODLE_ADMIN_PASSWORD=${MOODLE_ADMIN_PASSWORD}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME}
      - MOODLE_HOST=${MOODLE_HOST}
      - MOODLE_PORT=${MOODLE_PORT}
      - MOODLE_STUDENT_USER=${MOODLE_STUDENT_USER}
      - MOODLE_STUDENT_PASSWORD=${MOODLE_STUDENT_PASSWORD}
      - MOODLE_STUDENT_EMAIL=${MOODLE_STUDENT_EMAIL}
    volumes:
      - 'moodle_data:/var/www/html'
      - 'moodledata_data:/var/www/moodledata'
      - './scripts:/scripts'
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - moodle-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/login/index.php']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  mariadb_data:
    driver: local
  moodle_data:
    driver: local
  moodledata_data:
    driver: local

networks:
  moodle-network:
    driver: bridge
